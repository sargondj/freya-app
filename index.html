<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f7f4ec">
    <title>Freya Music Buttons</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app" aria-label="Freya music button app">
      <section class="button-grid" id="buttonGrid" aria-label="Music choices"></section>

      <button class="stop-button" id="stopButton" type="button" aria-label="Stop music">
        <span class="stop-icon" aria-hidden="true"></span>
        <span>Stop</span>
      </button>

      <section class="setup-panel" id="setupPanel" aria-label="Caregiver setup" hidden>
        <label class="file-picker">
          <span>Private audio for purple button</span>
          <input id="localAudioInput" type="file" accept=".mp3,.m4a,.aac,.wav,audio/mpeg,audio/mp3,audio/mp4,audio/aac,audio/wav,audio/x-wav,audio/*">
        </label>
        <a class="setup-link" href="./">Open Freya buttons</a>
        <button class="setup-action" id="clearLocalAudio" type="button">Use demo purple sound</button>
        <p class="setup-status" id="setupStatus" aria-live="polite"></p>
      </section>
    </main>

    <script src="app.js" defer></script>
  </body>
</html>
