<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f7f4ec">
    <title>Freya Music Buttons</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app" aria-label="Freya music button app">
      <section class="button-grid" id="buttonGrid" aria-label="Music choices"></section>

      <button class="stop-button" id="stopButton" type="button" aria-label="Stop music">
        <span class="stop-icon" aria-hidden="true"></span>
        <span>Stop</span>
      </button>
    </main>

    <script src="app.js" defer></script>
  </body>
</html>
